[project]
name = "imagory"
version = "0.2.1"
description = "Offline Windows photo browser for local folders and Google Takeout exports"
authors = [
    { name = "Mshahnawaz1", email = "shahnawaz919956@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pi-heif>=1.4.0",
    "pillow>=13.0.0",
    "pyside6-essentials>=6.12.0",
]

[project.gui-scripts]
imagory = "imagory.__main__:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[dependency-groups]
dev = [
    "pillow-heif>=1.8.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]
