name: Linux build

# Builds the single-file Linux binary with PyInstaller and uploads it as a downloadable
# artifact (a .tar.gz, so the file keeps its executable bit). Run it by hand: Actions >
# Linux build > Run workflow, then pick the branch, or push a branch named build/<anything>.
#
# Built on the oldest supported Ubuntu runner on purpose: a PyInstaller binary runs only on
# systems with the same or a newer glibc than the one it was built on (PRD section 13).
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test suite before building
        type: boolean
        default: false
  push:
    branches: ["build/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Use a scratch library, never a real one
        run: echo "IMAGORY_LIBRARY=$RUNNER_TEMP/imagory-library" >> "$GITHUB_ENV"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: uv run pytest -q
      - name: Build the binary
        run: uv run pyinstaller --noconfirm --clean imagory.spec
      - name: Smoke test (the binary starts and stays up)
        run: |
          ./dist/Imagory &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "Imagory exited early with code $?"; exit 1
          fi
          kill "$pid"
      - name: Package
        id: package
        run: |
          version=$(uv run python -c "import imagory; print(imagory.__version__)")
          name="Imagory-${version}-linux-x86_64"
          mkdir "$name"
          cp dist/Imagory LICENSE THIRD_PARTY_LICENSES.txt "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
